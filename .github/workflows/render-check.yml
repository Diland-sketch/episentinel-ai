name: Render preparation checks (manual)
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -c requirements-api-repro.txt -e '.[api,dev,app]'
      - run: python -m pytest tests/test_api.py tests/test_render_deployment.py -q -rs -p no:cacheprovider
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: frontend
        env:
          # Configuration/build check only; no site is published.
          VITE_API_URL: https://api.example.org/api/v1
      - run: docker build -t episentinel-render:check .
      - run: docker run --rm --entrypoint python episentinel-render:check -c "from pathlib import Path; assert not Path('/app/data').exists(); assert not Path('/app/.git').exists()"
